name: IRCTC Seat Availability Check

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  check-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create runtime configuration
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > config.py <<'PY'
          import os

          RAPIDAPI_KEY = os.environ["RAPIDAPI_KEY"]
          RAPIDAPI_HOST = os.environ.get("RAPIDAPI_HOST", "irctc-api3.p.rapidapi.com")
          TELEGRAM_BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          TELEGRAM_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID", "")

          JOURNEY_DATE = "2026-09-20"
          CLASSES_TO_CHECK = ["SL", "3A", "2A"]
          QUOTA = "GN"

          ROUTES = [
              {"name": "Bhopal → Indore", "train_number": "18234", "train_name": "Narmada Express", "from_station": "BPL", "to_station": "INDB"},
              {"name": "Indore → Bhopal", "train_number": "18233", "train_name": "Narmada Express", "from_station": "INDB", "to_station": "BPL"},
              {"name": "Bhopal → Gwalior", "train_number": "12192", "train_name": "Shridham SF Express", "from_station": "BPL", "to_station": "GWL"},
              {"name": "Gwalior → Bhopal", "train_number": "12191", "train_name": "Shridham SF Express", "from_station": "GWL", "to_station": "BPL"},
              {"name": "Indore → Gwalior", "train_number": "12919", "train_name": "Malwa Express", "from_station": "INDB", "to_station": "GWL"},
              {"name": "Gwalior → Indore", "train_number": "12920", "train_name": "Malwa Express", "from_station": "GWL", "to_station": "INDB"},
              {"name": "Gwalior → Etawah", "train_number": "19811", "train_name": "Kota-Etawah Express", "from_station": "GWL", "to_station": "ETW"},
              {"name": "Etawah → Gwalior", "train_number": "19812", "train_name": "Kota-Etawah Express", "from_station": "ETW", "to_station": "GWL"},
              {"name": "Indore → Etawah", "train_number": "04170", "train_name": "Indore-Subedarganj Special", "from_station": "INDB", "to_station": "ETW"},
              {"name": "Etawah → Indore", "train_number": "04169", "train_name": "Subedarganj-Indore Special", "from_station": "ETW", "to_station": "INDB"},
          ]
          PY

      - name: Check availability
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
