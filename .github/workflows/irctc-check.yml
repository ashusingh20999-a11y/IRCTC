name: IRCTC Seat Availability Check

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  check-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create runtime configuration
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > config.py <<'PY'
          import os

          RAPIDAPI_KEY = os.environ["RAPIDAPI_KEY"]
          RAPIDAPI_HOST = os.environ.get("RAPIDAPI_HOST", "irctc-api3.p.rapidapi.com")
          TELEGRAM_BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          TELEGRAM_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID", "")

          TRAIN_NUMBER = "12951"
          JOURNEY_DATE = "2026-09-20"
          FROM_STATION = "NDLS"
          TO_STATION = "BCT"
          CLASSES_TO_CHECK = ["SL", "3A", "2A"]
          QUOTA = "GN"
          POLL_INTERVAL_SECONDS = 0
          PY

      - name: Check availability
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
